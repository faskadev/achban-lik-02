
services:
  postgres:
    image: postgres:17-alpine
    container_name: achban-lik-db
    environment:
      POSTGRES_USER: achban
      POSTGRES_PASSWORD: achban123
      POSTGRES_DB: achban_lik
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "54321:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U achban -d achban_lik"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: achban-lik-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - JWT_
      - DB_HOST=postgres
      - DB_NAME=achban_lik
      - DB_USER=achban
      - DB_PASSWORD=achban123
      - DB_PORT=5432
    volumes:
      # Persist uploads
      - ./backend/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
